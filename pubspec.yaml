name: blockit_mobile
description: "BlockIT Mobile — an on-device Android app & website blocker with a Gmail email approval workflow. Sibling to the Windows BlockIT app."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Email approval workflow (ported from blocker_common.py):
  mailer: ^6.1.0 # SMTP send (smtp.gmail.com:465, SSL)
  enough_mail: ^2.1.6 # IMAP poll (imap.gmail.com:993)

  # File-based persistence of config/blocklist/state JSON in the app documents
  # directory, mirroring the Windows app's on-disk files (NOT shared_preferences).
  path_provider: ^2.1.4

  # Runtime permissions (notification etc.); native MethodChannel handles the
  # rest (accessibility deep-link, VPN prepare, battery optimization).
  permission_handler: ^11.3.1

  # Visual design system (Inter font) matching the web dashboard.
  google_fonts: ^6.2.1

  # Simple boot flags only (e.g. "onboarding complete").
  shared_preferences: ^2.3.2

  # Countdown / timestamp formatting.
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

  # Opens links in the device's browser (e.g. the Gmail App Password page).
  url_launcher: ^6.3.1

  # Salted SHA-256 hashing for the in-person PIN — only the hash is ever
  # persisted to config.json, never the PIN itself.
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # google_fonts fetches Inter at runtime; no bundled font assets required.
