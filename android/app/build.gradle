plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

// A STABLE release-signing key, committed alongside the app, so every build —
// whether from GitHub Actions or a local machine — produces an APK signed the
// same way. Without this, each CI run got its own throw-away debug keystore
// (Gradle auto-generates one when none exists), so every new build's
// signature differed from whatever was already installed and Android refused
// to install over it ("package conflicts with an existing package"). This
// keystore is deliberately checked into the repo rather than kept as a CI
// secret, since the whole point of this project's GitHub Actions workflow is
// to build without any secret-management step.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader("UTF-8") { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace = "com.blockit.mobile"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId = "com.blockit.mobile"
        // minSdk 26 — required for the app-usage/accessibility behavior and the
        // foreground service types used here.
        minSdk = 26
        targetSdk = 34
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        // Restricted to arm64-v8a: every real phone this app targets is arm64,
        // and building for other ABIs is both pointless and (when building
        // on-device in Termux, which only has arm64 toolchains) unbuildable.
        // Drop this if you ever build a universal APK from a desktop machine.
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // Stable signing key (see key.properties/blockit-release.keystore)
            // so updates install in place instead of colliding with whatever
            // signature the previous CI-built APK happened to get.
            signingConfig = keystorePropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
