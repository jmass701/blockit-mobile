plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "com.blockit.mobile"
    compileSdk = 34
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId = "com.blockit.mobile"
        // minSdk 26 — required for the app-usage/accessibility behavior and the
        // foreground service types used here.
        minSdk = 26
        targetSdk = 34
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        // Restricted to arm64-v8a: every real phone this app targets is arm64,
        // and building for other ABIs is both pointless and (when building
        // on-device in Termux, which only has arm64 toolchains) unbuildable.
        // Drop this if you ever build a universal APK from a desktop machine.
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            // Debug signing so `flutter run --release` works out of the box;
            // replace with a real keystore before shipping.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
